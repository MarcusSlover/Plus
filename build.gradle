plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'com.gradleup.nmcp'
    id 'signing'
}

group = 'com.marcusslover'
version = '4.5.1'

ext {
    isRelease = !version.toString().endsWith("SNAPSHOT")
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2-1'
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
    withSourcesJar()
    withJavadocJar()
}

test {
    useJUnitPlatform()
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
}
tasks.named('javadoc') {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'plus'
            version = project.version

            pom {
                name = 'Plus'
                description = 'A set of tools used for programming Minecraft plugins.'
                url = 'https://github.com/MarcusSlover/Plus'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://github.com/MarcusSlover/Plus/blob/master/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'marcusslover'
                        name = 'MarcusSlover'
                        email = 'jr.marcusorlando@gmail.com'
                    }
                }
                contributors {
                    contributor {
                        name = "tecc"
                        email = "tecc@tecc.me"
                        url = "https://tecc.me"
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/MarcusSlover/Plus.git'
                    developerConnection = 'scm:git:ssh://github.com/MarcusSlover/Plus.git'
                    url = 'https://github.com/MarcusSlover/Plus'
                }
            }
        }
    }

    repositories {
        maven {
            name = "centralPortalSnapshots"
            url = uri("https://central.sonatype.com/repository/maven-snapshots/")

            credentials {
                username = findProperty("portalUsername") ?: System.getenv("PORTAL_USERNAME")
                password = findProperty("portalPassword") ?: System.getenv("PORTAL_PASSWORD")
            }
        }
    }
}

signing {
    def signingKey = System.getenv("GPG_SIGNING_KEY")
    def signingPassword = System.getenv("GPG_SIGNING_PASSWORD")

    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    } else if (project.ext.isRelease) {
        logger.warn("GPG signing key not set - release artifacts will be unsigned.")
    }
}

nmcp {
    publishAllPublicationsToCentralPortal {
        username.set(providers.gradleProperty("centralUsername").orElse(providers.environmentVariable("CENTRAL_USERNAME")))
        password.set(providers.gradleProperty("centralPassword").orElse(providers.environmentVariable("CENTRAL_PASSWORD")))
    }
}
